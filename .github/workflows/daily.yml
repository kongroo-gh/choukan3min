name: 朝刊3分 毎朝の投稿

# 原稿はローカル（Claude Code）で作って commit しておく。
# ここは「検査して投稿する」だけを行う。Anthropic API は一切呼ばない。
#
#   ローカル  調査 → 構成 → 画像 → 関門1 → 関門2 → commit & push
#   ここ      揃っているか確認 → 関門1を再実行 → 関門2の結果を確認 → 投稿
#
# 関門2（中身の校閲）はローカルで行うが、その結果 review.json の存在と
# 原稿との対応を check_review.py が機械的に確かめる。校閲を忘れたまま、
# あるいは校閲後に原稿を差し替えたままでは投稿できない。

on:
  schedule:
    # 21:35 UTC = 6:35 JST（毎日）
    - cron: '35 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYY-MM-DD（空なら今日）'
        required: false
        default: ''
      dry_run:
        description: '検査だけ行い、投稿はしない'
        type: boolean
        default: false

concurrency:
  group: choukan3min
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 対象日を決める
        id: d
        run: |
          DAY="${{ github.event.inputs.date }}"
          if [ -z "$DAY" ]; then DAY=$(TZ=Asia/Tokyo date +%F); fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "dir=post/$DAY" >> "$GITHUB_OUTPUT"
          echo "対象: post/$DAY"

      - name: 今日の原稿があるか確かめる
        id: have
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="${{ steps.d.outputs.dir }}"
          DAY="${{ steps.d.outputs.day }}"
          if [ -f "$DIR/content.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "原稿があります: $DIR"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$DIR に原稿がありません。投稿せず終了します。"
            {
              echo "### $DAY は休刊です"
              echo ""
              echo "\`$DIR/content.json\` が見つかりませんでした。"
              echo "ローカルで原稿を作って push すると、次回の実行で投稿されます。"
            } >> "$GITHUB_STEP_SUMMARY"
            BODY=$(printf '%s\n' \
              "\`$DIR/content.json\` が見つからないため、投稿を行いませんでした。" \
              "" \
              "原稿はローカル（Claude Code）で作って commit する運用です。" \
              "考えられる原因:" \
              "- Mac がスリープしていて、朝の生成が走らなかった" \
              "- 生成はしたが push していない" \
              "- 検査で止まって原稿が完成しなかった" \
              "" \
              "実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh issue create \
              --title "朝刊3分 $DAY は原稿がありませんでした" \
              --body "$BODY" \
              2>/dev/null || echo "Issue の作成をスキップしました"
          fi

      - uses: actions/setup-python@v5
        if: steps.have.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: 形式を検査する（関門1）
        if: steps.have.outputs.ready == 'true'
        run: python3 scripts/validate.py "${{ steps.d.outputs.dir }}"

      - name: 校閲の結果を確認する（関門2）
        if: steps.have.outputs.ready == 'true'
        env:
          REVIEW_STRICT: ${{ vars.REVIEW_STRICT }}
        run: python3 scripts/check_review.py "${{ steps.d.outputs.dir }}"

      - name: 生成物を残す（Actions画面から確認できる）
        if: steps.have.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ steps.d.outputs.day }}
          path: |
            ${{ steps.d.outputs.dir }}/instagram/*.png
            ${{ steps.d.outputs.dir }}/bluesky/*.png
            ${{ steps.d.outputs.dir }}/*.txt
            ${{ steps.d.outputs.dir }}/*.json
            ${{ steps.d.outputs.dir }}/*.md
          retention-days: 30

      - name: 公開してよいか判定する
        id: gate
        if: steps.have.outputs.ready == 'true'
        run: |
          # AUTO_PUBLISH が明示的に false のときだけ止める。未設定なら投稿する。
          PUB=true
          if [ "${{ vars.AUTO_PUBLISH }}" = "false" ]; then
            echo "AUTO_PUBLISH が false のため投稿しません。"; PUB=false
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry_run が指定されたため投稿しません。"; PUB=false
          fi
          if [ -f "${{ steps.d.outputs.dir }}/.posted-bluesky" ]; then
            echo "既に投稿済みです。二重投稿を防ぐため中止します。"; PUB=false
          fi
          echo "publish=$PUB" >> "$GITHUB_OUTPUT"
          echo "publish=$PUB"

      - name: Bluesky へ投稿する
        if: steps.gate.outputs.publish == 'true'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python3 scripts/post_bluesky.py "${{ steps.d.outputs.dir }}"

      - name: 投稿済みの印を残す
        if: steps.gate.outputs.publish == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "${{ steps.d.outputs.dir }}/.posted-bluesky"
          git add "${{ steps.d.outputs.dir }}/.posted-bluesky"
          git commit -m "posted: ${{ steps.d.outputs.day }} (bluesky)"
          git pull --rebase --autostash || true
          git push

      - name: 投稿しなかった理由を記録する
        if: steps.have.outputs.ready == 'true' && steps.gate.outputs.publish != 'true'
        run: |
          {
            echo "### ${{ steps.d.outputs.day }} の原稿は検査を通りました（未投稿）"
            echo ""
            echo "投稿は行っていません。理由は次のいずれかです。"
            echo "- Variables の \`AUTO_PUBLISH\` が \`false\` になっている"
            echo "- 実行時に \`dry_run\` に ✓ が入っていた"
            echo "- 既に \`.posted-bluesky\` があり、二重投稿を防いだ"
            echo ""
            echo "上の Artifacts から画像とキャプションを確認できます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗したら Issue を立てる
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 本文は必ず printf で組み立てる。ここに素の複数行文字列を書くと
          # 行頭が run: | の字下げから外れ、YAML のブロックが途中で終わる。
          # そうなるとワークフロー全体が起動前に失敗する（過去に踏んだ）。
          BODY=$(printf '%s\n' \
            "実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "投稿は行われていません。ログを確認してください。よくある原因:" \
            "- 検査（validate.py）に引っかかった（禁止表現・文字数超過・出典不足など）" \
            "- 校閲の確認（check_review.py）で止まった（review.json が無い・critical あり・原稿と不一致）" \
            "- Bluesky のアプリパスワードが失効している")
          gh issue create \
            --title "朝刊3分 ${{ steps.d.outputs.day }} の投稿に失敗しました" \
            --body "$BODY" \
            2>/dev/null || echo "Issue の作成をスキップしました"
